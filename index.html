<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System Scout</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Solar System Scout</h1>
      <p class="subtitle">Click the requested world before the timer runs out.</p>

      <section class="hud" aria-live="polite">
        <p>Target: <strong id="targetLabel">Press Start</strong></p>
        <p>Score: <strong id="score">0</strong></p>
        <p>Time: <strong id="timeLeft">60</strong>s</p>
      </section>

      <div class="controls">
        <button id="startButton" type="button">Start game</button>
        <button id="pauseButton" type="button" disabled>Pause</button>
      </div>

      <canvas id="gameCanvas" width="1100" height="740" aria-label="Solar system simulation"></canvas>
      <p id="status" class="status">Build your map of planets, moons, and asteroids.</p>
    </main>

    <script src="game.js" defer></script>
  </body>
</html>
